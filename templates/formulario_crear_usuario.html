<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear usuario</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>

        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,.20),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(255,255,255,.15),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #006b38 0%,
                    #008f4c 35%,
                    #18b965 65%,
                    #55df91 100%
                );

            background-attachment: fixed;

        }


        /* =========================================
           CONTENEDOR PRINCIPAL
        ========================================= */

        .pagina {

            width: 100%;

            max-width: 900px;

        }


        /* =========================================
           NAVBAR
        ========================================= */

        .navbar-verde {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;

            padding: 15px 25px;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    #087f43,
                    #034d29
                );

            box-shadow:

                0 6px 0 #02371d,

                0 15px 25px
                rgba(0,0,0,.30);

        }


        .navbar-verde a {

            color: white;

            text-decoration: none;

            font-size: 1.35rem;

            font-weight: 800;

            text-shadow:
                0 2px 4px rgba(0,0,0,.35);

        }


        .navbar-verde a:hover {

            color: #baffd6;

        }


        .navbar-verde i {

            margin-right: 8px;

        }


        /* =========================================
           TARJETA DEL FORMULARIO
        ========================================= */

        .formulario-card {

            position: relative;

            background:

                linear-gradient(
                    145deg,
                    #ffffff,
                    #f1f5f3
                );

            border-radius: 22px;

            padding: 40px;

            border:
                1px solid
                rgba(255,255,255,.9);

            box-shadow:

                0 10px 0 rgba(0,55,30,.45),

                0 25px 45px
                rgba(0,0,0,.30),

                inset 0 2px 4px
                rgba(255,255,255,.8);

            overflow: hidden;

        }


        /* =========================================
           BRILLO SUPERIOR
        ========================================= */

        .formulario-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 6px;

            background:

                linear-gradient(
                    90deg,
                    #006b38,
                    #13b965,
                    #65efa0
                );

        }


        /* =========================================
           TITULO
        ========================================= */

        .titulo {

            text-align: center;

            color: #063d24;

            font-size: 2rem;

            font-weight: 800;

            margin-bottom: 8px;

            text-shadow:
                0 2px 2px rgba(0,0,0,.10);

        }


        .subtitulo {

            text-align: center;

            color: #6c757d;

            margin-bottom: 35px;

        }


        .titulo i {

            color: #078644;

            margin-right: 8px;

        }


        /* =========================================
           FILAS
        ========================================= */

        .fila {

            display: flex;

            gap: 25px;

            margin-bottom: 22px;

        }


        .campo {

            flex: 1;

        }


        /* =========================================
           LABELS
        ========================================= */

        label {

            display: block;

            margin-bottom: 8px;

            color: #164b31;

            font-weight: 700;

        }


        label i {

            color: #078644;

            width: 22px;

        }


        /* =========================================
           INPUTS
        ========================================= */

        .input-contenedor {

            position: relative;

        }


        .input-icono {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #078644;

            z-index: 5;

        }


        input {

            width: 100%;

            height: 50px;

            padding:
                10px 15px 10px 45px;

            border:
                1px solid #ced8d2;

            border-radius: 11px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f3f6f4
                );

            color: #222;

            font-size: 14px;

            box-shadow:

                inset 0 2px 5px
                rgba(0,0,0,.06),

                0 3px 6px
                rgba(0,0,0,.06);

            transition:
                all .25s ease;

        }


        input:hover {

            border-color: #72b994;

            box-shadow:

                0 5px 12px
                rgba(0,100,50,.12);

        }


        input:focus {

            outline: none;

            border-color: #07904b;

            background: white;

            transform:
                translateY(-2px);

            box-shadow:

                0 0 0 4px
                rgba(7,144,75,.12),

                0 7px 15px
                rgba(0,100,50,.15);

        }


        /* =========================================
           BOTONES
        ========================================= */

        .botones {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-top: 35px;

        }


        .btn-form {

            flex: 1;

            min-height: 50px;

            border: none;

            border-radius: 11px;

            font-size: 15px;

            font-weight: 700;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition:
                all .25s ease;

        }


        /* =========================================
           BOTON GUARDAR
        ========================================= */

        .btn-guardar {

            color: white;

            background:

                linear-gradient(
                    145deg,
                    #16bd67,
                    #04743b
                );

            box-shadow:

                0 6px 0 #034c27,

                0 10px 18px
                rgba(0,100,50,.25);

            text-shadow:
                0 2px 3px rgba(0,0,0,.3);

        }


        .btn-guardar:hover {

            color: white;

            text-decoration: none;

            transform:
                translateY(-4px);

            background:

                linear-gradient(
                    145deg,
                    #24d978,
                    #058b47
                );

            box-shadow:

                0 9px 0 #034c27,

                0 15px 25px
                rgba(0,100,50,.35);

        }


        .btn-guardar:active {

            transform:
                translateY(3px);

            box-shadow:

                0 2px 0 #034c27,

                0 5px 10px
                rgba(0,0,0,.20);

        }


        /* =========================================
           BOTON VOLVER
        ========================================= */

        .btn-volver {

            color: #075a32;

            background:

                linear-gradient(
                    145deg,
                    #ffffff,
                    #e6eee9
                );

            border:
                1px solid #c7d6cd;

            box-shadow:

                0 5px 0 #aabdb2,

                0 8px 15px
                rgba(0,0,0,.12);

        }


        .btn-volver:hover {

            color: #034d29;

            text-decoration: none;

            transform:
                translateY(-3px);

            box-shadow:

                0 8px 0 #aabdb2,

                0 12px 20px
                rgba(0,0,0,.18);

        }


        /* =========================================
           MENSAJES FLASH
        ========================================= */

        .flashes {

            list-style: none;

            padding: 0;

            margin: 0 0 20px 0;

        }


        .flashes li {

            padding: 13px 18px;

            border-radius: 10px;

            background: #dff7e8;

            color: #075a32;

            border-left:
                5px solid #078644;

            box-shadow:
                0 8px 15px
                rgba(0,0,0,.12);

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {

            body {

                padding: 15px;

            }


            .formulario-card {

                padding: 28px 20px;

            }


            .fila {

                flex-direction: column;

                gap: 20px;

                margin-bottom: 20px;

            }


            .botones {

                flex-direction: column;

            }


            .btn-form {

                width: 100%;

            }


            .titulo {

                font-size: 1.7rem;

            }

        }

    </style>

</head>


<body>


<div class="pagina">


    <!-- =====================================
         BARRA SUPERIOR
    ====================================== -->

    <nav class="navbar-verde">

        <a href="/">

            <i class="fas fa-toolbox"></i>

            Inventtools

        </a>

        <a href="/">

            <i class="fas fa-home"></i>

            Inicio

        </a>

    </nav>


    <!-- =====================================
         MENSAJES FLASH
    ====================================== -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <ul class="flashes">

                {% for message in messages %}

                    <li>

                        <i class="fas fa-circle-check"></i>

                        {{ message }}

                    </li>

                {% endfor %}

            </ul>

        {% endif %}

    {% endwith %}


    <!-- =====================================
         FORMULARIO
    ====================================== -->

    <div class="formulario-card">


        <h2 class="titulo">

            <i class="fas fa-user-plus"></i>

            Crear usuario

        </h2>


        <p class="subtitulo">

            Registra un nuevo usuario en Inventtools

        </p>


        <form action="/crear_usuario"
              method="post">


            <!-- =================================
                 PRIMERA FILA
            ================================== -->

            <div class="fila">


                <!-- NOMBRE -->

                <div class="campo">

                    <label for="nombre_completo">

                        <i class="fas fa-user"></i>

                        Nombre completo

                    </label>


                    <div class="input-contenedor">

                        <i class="fas fa-user input-icono"></i>

                        <input
                            type="text"
                            id="nombre_completo"
                            name="nombre_completo"
                            placeholder="Ingrese el nombre completo"
                            required>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="campo">

                    <label for="email">

                        <i class="fas fa-envelope"></i>

                        Email

                    </label>


                    <div class="input-contenedor">

                        <i class="fas fa-envelope input-icono"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Ingrese el email"
                            required>

                    </div>

                </div>


            </div>


            <!-- =================================
                 SEGUNDA FILA
            ================================== -->

            <div class="fila">


                <!-- CONTRASEÑA -->

                <div class="campo">

                    <label for="contraseña">

                        <i class="fas fa-lock"></i>

                        Contraseña

                    </label>


                    <div class="input-contenedor">

                        <i class="fas fa-lock input-icono"></i>

                        <input
                            type="password"
                            id="contraseña"
                            name="contraseña"
                            placeholder="Ingrese la contraseña"
                            required>

                    </div>

                </div>


                <!-- ROL -->

                <div class="campo">

                    <label for="rol">

                        <i class="fas fa-user-shield"></i>

                        Rol

                    </label>


                    <div class="input-contenedor">

                        <i class="fas fa-user-shield input-icono"></i>

                        <input
                            type="text"
                            id="rol"
                            name="rol"
                            placeholder="Ej: administrador"
                            required>

                    </div>

                </div>


            </div>


            <!-- =================================
                 BOTONES
            ================================== -->

            <div class="botones">


                <button
                    type="submit"
                    class="btn-form btn-guardar">

                    <i class="fas fa-user-plus mr-2"></i>

                    Guardar usuario

                </button>


                <a
                    href="/"
                    class="btn-form btn-volver">

                    <i class="fas fa-arrow-left mr-2"></i>

                    Volver al inicio

                </a>


            </div>


        </form>


    </div>


</div>


</body>

</html>
